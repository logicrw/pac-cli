[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pac-cli"
version = "0.2.2"
description = "Fetch paywalled news articles as markdown (CLI for agents)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=2.0",
    "markdownify>=0.14",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
stealth = ["curl_cffi>=0.7.0", "camoufox>=0.4.0"]
patchright = ["patchright>=1.0"]
eval = ["PyYAML>=6.0"]
all = ["curl_cffi>=0.7.0", "camoufox>=0.4.0", "PyYAML>=6.0"]

[project.scripts]
pac = "bpc_fetch.cli:main"
bpc-fetch = "bpc_fetch.cli:main"

[project.urls]
Homepage = "https://github.com/logicrw/pac-cli"
Repository = "https://github.com/logicrw/pac-cli"
Issues = "https://github.com/logicrw/pac-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bpc_fetch"]

[tool.hatch.build.targets.wheel.force-include]
"data/sites.js" = "bpc_fetch/data/sites.js"
