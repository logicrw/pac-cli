[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pac-cli"
version = "0.2.0"
description = "Fetch paywalled news articles as markdown (CLI for agents)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=2.0",
    "markdownify>=0.14",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
patchright = ["patchright>=1.0"]

[project.scripts]
pac = "bpc_fetch.cli:main"
bpc-fetch = "bpc_fetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bpc_fetch"]
